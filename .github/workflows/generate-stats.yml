name: Generate accurate GitHub Stats SVG

# run every 30 minutes
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write   # allow committing files
  actions: read     # default

concurrency:
  group: generate-stats
  cancel-in-progress: true

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install requests

      - name: Generate stats SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: Daxesh512
          REPO: ${{ github.repository }}
        run: |
          cat > generate_stats.py <<'PY'
#!/usr/bin/env python3
import os, sys, math, json, time
import requests

OWNER = os.getenv("OWNER")
TOKEN = os.getenv("GITHUB_TOKEN")
if not OWNER or not TOKEN:
    print("Missing OWNER or GITHUB_TOKEN", file=sys.stderr)
    sys.exit(1)

headers = {"Authorization": f"token {TOKEN}", "Accept": "application/vnd.github.v3+json"}

# fetch all repos (public)
per_page = 100
page = 1
repos = []
while True:
    url = f"https://api.github.com/users/{OWNER}/repos?per_page={per_page}&page={page}&type=owner"
    r = requests.get(url, headers=headers, timeout=30)
    if r.status_code != 200:
        print("Failed to fetch repos:", r.status_code, r.text, file=sys.stderr)
        sys.exit(1)
    page_repos = r.json()
    if not page_repos:
        break
    repos.extend(page_repos)
    page += 1
    time.sleep(0.1)

# Compute total stars and aggregate languages (by bytes)
total_stars = 0
lang_bytes = {}
for repo in repos:
    total_stars += repo.get("stargazers_count", 0)
    # languages API per repo
    owner = repo['owner']['login']
    name = repo['name']
    lang_url = f"https://api.github.com/repos/{owner}/{name}/languages"
    lr = requests.get(lang_url, headers=headers, timeout=30)
    if lr.status_code == 200:
        lang_data = lr.json()
        for lang, b in lang_data.items():
            lang_bytes[lang] = lang_bytes.get(lang, 0) + b
    else:
        # skip silently if languages endpoint fails for a repo
        pass
    time.sleep(0.05)

# compute top languages percentages
total_bytes = sum(lang_bytes.values()) or 1
sorted_langs = sorted(lang_bytes.items(), key=lambda x: x[1], reverse=True)
top_langs = [(lang, (bytes_count/total_bytes)*100) for lang, bytes_count in sorted_langs[:6]]

# Build a minimal but clear SVG similar-ish to the cards
# keep width/height reasonable
svg_width = 860
svg_height = 170

# helper for safe text
def esc(s):
    return str(s).replace("&","&amp;").replace("<","&lt;").replace(">","&gt;")

# Compose SVG
svg = []
svg.append(f'<svg width="{svg_width}" height="{svg_height}" viewBox="0 0 {svg_width} {svg_height}" fill="none" xmlns="http://www.w3.org/2000/svg" role="img">')
svg.append('<style>')
svg.append(""".title{font:600 20px 'Segoe UI', Ubuntu, Sans-Serif; fill:#70a5fd;}
.stat{font:600 16px 'Segoe UI', Ubuntu, Sans-Serif; fill:#38bdae;}
.lang{font:600 13px 'Segoe UI', Ubuntu, Sans-Serif; fill:#9aa0b4;}
.bg{fill:#0f1720;}
.card{stroke:#151515; fill:#0f1720; rx:12px;}""")
svg.append('</style>')

svg.append(f'<rect width="{svg_width}" height="{svg_height}" class="bg"/>')
svg.append(f'<g transform="translate(20,20)">')
svg.append(f'<rect width="{svg_width-40}" height="{svg_height-40}" class="card" />')
svg.append(f'<text x="24" y="36" class="title">{esc(OWNER)}\\'s GitHub Stats</text>')
# stats column
svg.append(f'<text x="24" y="68" class="stat">Total Stars Earned: <tspan fill="#9be5d8">{total_stars}</tspan></text>')
svg.append(f'<text x="24" y="92" class="stat">Total Repositories: <tspan fill="#9be5d8">{len(repos)}</tspan></text>')
# top langs
svg.append(f'<text x="440" y="56" class="title">Most Used Languages</text>')
y = 80
for lang, pct in top_langs:
    svg.append(f'<text x="440" y="{y}" class="lang">● {esc(lang)} {pct:.2f}%</text>')
    y += 20

# footer small note
svg.append(f'<text x="24" y="{svg_height-30}" class="lang">Updated via GitHub Action • Last update: {time.strftime("%Y-%m-%d %H:%M UTC", time.gmtime())}</text>')
svg.append('</g></svg>')

outdir = "assets"
os.makedirs(outdir, exist_ok=True)
outfile = os.path.join(outdir, "stats.svg")
with open(outfile, "w", encoding="utf-8") as fh:
    fh.write("\n".join(svg))

print("Wrote", outfile)
PY

          # run the generator
          python generate_stats.py

      - name: Add & commit new SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: update generated stats.svg (automated)" || true
          git push origin HEAD:${{ github.ref_name }}
